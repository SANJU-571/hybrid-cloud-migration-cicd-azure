# Local observability lab: fraud-detection API + load generator + Prometheus
# (SLO recording rules and burn-rate alerts) + Grafana dashboard.
#
#   docker compose up -d --build              # http://localhost:3000 (Grafana), :9090 (Prometheus)
#   FAULT_ERROR_RATE=0.2 docker compose up -d fraud-api   # inject 20% errors -> watch the burn-rate alert
#   docker compose down -v
name: nfb-observability

services:
  fraud-api:
    build:
      context: ../app/fraud-detection
    environment:
      FAULT_ERROR_RATE: ${FAULT_ERROR_RATE:-0}
      FAULT_LATENCY_MS: ${FAULT_LATENCY_MS:-0}
    ports:
      - "8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true

  loadgen:
    image: python:3.11-alpine
    command: ["python", "/loadgen.py"]
    environment:
      TARGET: http://fraud-api:8080
      RPS: "10"
    volumes:
      - ./loadgen.py:/loadgen.py:ro
    depends_on:
      - fraud-api

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - fraud-api

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fraud-api-slo.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
