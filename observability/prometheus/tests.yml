# Unit tests for the alerting rules: `promtool test rules tests.yml`
# (run in CI by the App workflow).
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # 50% of scoring requests fail -> fast-burn page fires; slow burn has not
  # been sustained long enough (for: 15m) yet.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="fraud-detection",method="POST",route="/v1/score",code="200"}'
        values: '0+60x30'
      - series: 'http_requests_total{job="fraud-detection",method="POST",route="/v1/score",code="500"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: FraudApiErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: fraud-api-availability
            exp_annotations:
              summary: Fraud API is burning its error budget 14x too fast
              runbook_url: https://github.com/SANJU-571/hybrid-cloud-migration-cicd-azure/blob/main/docs/runbooks/fraud-api-errors.md
      - eval_time: 10m
        alertname: FraudApiErrorBudgetSlowBurn
        exp_alerts: []

  # Healthy traffic (0.1% errors, well inside the 0.5% budget) -> no pages.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="fraud-detection",method="POST",route="/v1/score",code="200"}'
        values: '0+999x30'
      - series: 'http_requests_total{job="fraud-detection",method="POST",route="/v1/score",code="500"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: FraudApiErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 20m
        alertname: FraudApiErrorBudgetSlowBurn
        exp_alerts: []

  # Scrape target disappears -> FraudApiDown after 1 minute.
  - interval: 1m
    input_series:
      - series: 'up{job="fraud-detection",instance="fraud-api:8080"}'
        values: '1 1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: FraudApiDown
        exp_alerts: []
      - eval_time: 5m
        alertname: FraudApiDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: fraud-detection
              instance: fraud-api:8080
            exp_annotations:
              summary: Prometheus cannot scrape the fraud-detection API
              runbook_url: https://github.com/SANJU-571/hybrid-cloud-migration-cicd-azure/blob/main/docs/runbooks/fraud-api-errors.md
